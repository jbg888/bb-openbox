# Runs the scraper on GitHub's servers — no computer needed.
# Schedule is UTC: 07:00 UTC = midnight Pacific (PDT). Adjust after the probe data tells us when Best Buy updates.
name: scrape
on:
  schedule:
    - cron: "0 7,13,19,1 * * *"     # 00:00, 06:00, 12:00, 18:00 Pacific (PDT)
  workflow_dispatch:                # "Run workflow" button in the Actions tab
    inputs:
      only:
        description: "Only these categories (comma-separated), for quick tests. Blank = all."
        required: false
        default: ""
permissions:
  contents: write
concurrency: scrape
jobs:
  scrape:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22 }
      - run: npm ci || npm install
      - run: npx playwright install --with-deps chromium
      - name: scrape
        env:
          CI: "true"
          # Only needed if Best Buy blocks GitHub's IPs. Add these under Settings > Secrets and variables > Actions.
          PROXY_SERVER: ${{ secrets.PROXY_SERVER }}
          PROXY_USER: ${{ secrets.PROXY_USER }}
          PROXY_PASS: ${{ secrets.PROXY_PASS }}
        run: |
          if [ -n "${{ inputs.only }}" ]; then node scrape.js --no-push --only "${{ inputs.only }}"; else node scrape.js --no-push; fi
      - name: commit results
        run: |
          git config user.name "scraper"
          git config user.email "scraper@users.noreply.github.com"
          git add docs data
          git diff --cached --quiet || git commit -m "deals $(date -u +%FT%TZ)"
          git push
